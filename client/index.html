<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111113" />
    <meta
      name="description"
      content="Explore Kestrel, a search engine built from first principles in Java. Custom positional indexing, BM25 ranking, and concurrent search."
    />
    <link rel="icon" type="image/svg+xml" href="/kestrel.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>kestrel</title>
    <script>
      try {
        const theme = localStorage.getItem("kestrel-theme");
        document.documentElement.dataset.theme =
          theme === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
